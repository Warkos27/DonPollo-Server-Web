version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: donpollo_mosquitto
    ports:
      - "1883:1883" # Puerto MQTT para el ESP32 y Kotlin
      - "9001:9001" # Puerto WebSockets para tu futura página web React
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped

  influxdb:
    image: influxdb:2.0
    container_name: donpollo_influxdb
    ports:
      - "8086:8086" # Puerto del panel de control de la base de datos
    volumes:
      - influxdb_data:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=donpollo123
      - DOCKER_INFLUXDB_INIT_ORG=granja
      - DOCKER_INFLUXDB_INIT_BUCKET=sensores
    restart: unless-stopped

# --- NUEVO SERVICIO AÑADIDO ---
  telegraf:
    image: telegraf:latest
    container_name: donpollo_telegraf
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    depends_on:
      - mosquitto
      - influxdb
    restart: unless-stopped

volumes:
  mosquitto_data:
  mosquitto_log:
  influxdb_data: