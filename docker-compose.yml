version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: donpollo_mosquitto
    ports:
      - "1883:1883" 
      - "9001:9001" 
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - donpollo_network
    restart: unless-stopped

  influxdb:
    image: influxdb:2.0
    container_name: donpollo_influxdb
    ports:
      - "8086:8086" 
    volumes:
      - influxdb_data:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=donpollo123
      - DOCKER_INFLUXDB_INIT_ORG=granja
      - DOCKER_INFLUXDB_INIT_BUCKET=sensores
    networks:
      - donpollo_network
    restart: unless-stopped

  telegraf:
    image: telegraf:latest
    container_name: donpollo_telegraf
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    depends_on:
      - mosquitto
      - influxdb
    networks:
      - donpollo_network
    restart: unless-stopped

volumes:
  mosquitto_data:
  mosquitto_log:
  influxdb_data:

networks:
  donpollo_network:
    driver: bridge